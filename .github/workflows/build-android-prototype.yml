name: Build Only Up Alpha Android prototype
on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/build-android-prototype.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Configure Godot export templates
        run: |
          godot --version
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          ls -la ~/.local/share/godot/export_templates
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          echo "Java SDK: $JAVA_PATH"
          echo "Godot config: $HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"
      - name: Build Android ARMv7 APK
        run: |
          cd godot
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/usr/lib/android-sdk
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          godot --headless --path . --editor --quit
          godot --headless --verbose --path . --export-debug 'Android ARMv7' ../OnlyUpAlpha-Android.apk
          test -s ../OnlyUpAlpha-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OnlyUpAlpha-Android-ARMv7
          path: OnlyUpAlpha-Android.apk
          if-no-files-found: error
